name = "retrobat-api"
main = "src/index.ts"
compatibility_date = "2026-11-13"
compatibility_flags = ["nodejs_compat"]
account_id = "2263e816c670f9c372ddd4db453bc458"

# Client auto-update metadata (non-secret). Bump on each client release and
# point CLIENT_DOWNLOAD_URL at the published installer (e.g. an R2 URL).
[vars]
CLIENT_LATEST_VERSION = "0.1.0"
CLIENT_MIN_VERSION = "0.1.0"
CLIENT_DOWNLOAD_URL = ""
CLIENT_RELEASE_NOTES = ""

# D1 (SQLite) — created in Phase 0
[[d1_databases]]
binding = "DB"
database_name = "retrobat-db"
database_id = "4ffd9d56-de6d-4a89-b61b-60d2193a072f"

# R2 (ROM storage) — bucket pending: enable R2 in dashboard, then
#   wrangler r2 bucket create retrobat-roms
[[r2_buckets]]
binding = "ROMS"
bucket_name = "retrobat-roms"

# Secrets (never committed): set with `wrangler secret put <NAME>`
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, JWT_SECRET,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Local dev values go in backend/.dev.vars (gitignored).
