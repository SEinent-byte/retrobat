# PlayVault movement overlay — 3D/analog systems (n64, psx).
# Layered after playvault.cfg via --appendconfig. The base binds the arrow keys
# to the left analog stick; here we free the d-pad so a single arrow press does
# NOT also fire a d-pad action (e.g. Army Men N64: d-pad down = crouch). Result:
# arrows drive the analog stick only, so 3D movement is unambiguous.
input_player1_up = "nul"
input_player1_down = "nul"
input_player1_left = "nul"
input_player1_right = "nul"
