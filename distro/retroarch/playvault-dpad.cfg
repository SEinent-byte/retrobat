# PlayVault movement overlay — 2D/d-pad systems (nes, snes, gb, gbc, gba,
# megadrive, mastersystem, nds).
# Layered after playvault.cfg via --appendconfig. These systems have no analog
# stick, so movement is the d-pad (RetroArch's keyboard default already binds
# the arrows to the d-pad). Here we clear the base's analog-on-arrows binds so
# the arrows are not double-bound. Result: arrows drive the d-pad only.
input_player1_l_x_minus = "nul"
input_player1_l_x_plus = "nul"
input_player1_l_y_minus = "nul"
input_player1_l_y_plus = "nul"
