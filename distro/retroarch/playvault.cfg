# PlayVault RetroArch overrides, layered via --appendconfig on top of the
# user's retroarch.cfg at game launch. Keeps the window borderless (no
# "RetroArch <core>" title bar) and windowed; the launcher then expands it to
# the desktop work area so it fills the screen with the taskbar still visible.
video_fullscreen = "false"
video_windowed_fullscreen = "false"
video_window_show_decorations = "false"
video_window_save_positions = "false"

# Keyboard left analog stick. RetroArch's default keyboard binds cover the
# d-pad and face buttons but leave the analog stick unmapped, so 3D games that
# move with the stick (N64, PSX) are unplayable on a bare keyboard. Drive the
# left stick from the arrow keys so a laptop user can walk without a gamepad.
# A plugged-in controller still auto-configures (autoconfig/) and overrides.
input_player1_l_x_minus = "left"
input_player1_l_x_plus = "right"
input_player1_l_y_minus = "up"
input_player1_l_y_plus = "down"

# Keyboard buttons: the key letter matches the on-screen button label, so a
# game prompt "press A" means press A, "B" means B, N64 "Z" means Z. RetroArch's
# default (A=x, B=z, X=s, Y=a) does not match any label and is the main source
# of confusion. Each RetroPad button is bound to exactly one key (no duplicates).
input_player1_a = "a"
input_player1_b = "b"
input_player1_x = "x"
input_player1_y = "y"
input_player1_l = "q"
input_player1_r = "w"
input_player1_l2 = "z"          # N64 Z trigger
input_player1_r2 = "c"
input_player1_start = "enter"
input_player1_select = "rshift"
# N64 C-buttons live on the right analog stick; put them on the I/J/K/L cluster.
input_player1_r_y_minus = "i"   # C-up
input_player1_r_y_plus = "k"    # C-down
input_player1_r_x_minus = "j"   # C-left
input_player1_r_x_plus = "l"    # C-right

# NOTE on movement: the arrow keys always move the player, on every system. How
# they route differs by hardware, so the launcher layers one more cfg on top of
# this base per system:
#   - playvault-analog.cfg (3D: n64, psx) frees the d-pad so the arrows drive
#     only the left analog stick above.
#   - playvault-dpad.cfg   (2D: nes, snes, gb, …) clears the analog binds above
#     so the arrows drive only the d-pad (these systems have no analog stick).
# This keeps "arrows = move" identical for the player across all games.
