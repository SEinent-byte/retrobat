# PlayVault RetroArch overrides, layered via --appendconfig on top of the
# user's retroarch.cfg at game launch. Keeps the window borderless (no
# "RetroArch <core>" title bar) and windowed; the launcher then expands it to
# the desktop work area so it fills the screen with the taskbar still visible.
video_fullscreen = "false"
video_windowed_fullscreen = "false"
video_window_show_decorations = "false"
video_window_save_positions = "false"
